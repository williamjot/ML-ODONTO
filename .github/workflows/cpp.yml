name: C++ (núcleo e programa nativo)

on:
  push:
    paths:
      - "cpp/**"
      - "software/odontolesao/inst/sql/**"
      - "software/odontolesao/inst/manuais/**"
      - "software/odontolesao/inst/modelos/modelos.yml"
      - ".github/workflows/cpp.yml"
  pull_request:
    paths:
      - "cpp/**"
      - "software/odontolesao/inst/sql/**"
      - "software/odontolesao/inst/manuais/**"
      - "software/odontolesao/inst/modelos/modelos.yml"
      - ".github/workflows/cpp.yml"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S cpp -B cpp/build/ci -DML_ODONTO_BUILD_TESTS=ON -DML_ODONTO_ENABLE_WARNINGS_AS_ERRORS=ON
      - name: Build
        run: cmake --build cpp/build/ci --config Release
      - name: Test
        run: ctest --test-dir cpp/build/ci -C Release --output-on-failure

  # Adaptador ONNX e comando run. O modelo não está no repositório, então aqui só compila e roda
  # os testes do núcleo; a equivalência com as radiografias roda no computador local
  # (cpp/tools/validate_pipeline.py).
  onnx:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Ninja
        run: python -m pip install ninja
      - name: Build with ONNX Runtime
        run: python cpp/tools/build.py --system-compiler --no-install

  # Programa nativo (Qt 6 + MinGW pelo aqtinstall): compila e roda os testes do núcleo e do programa
  desktop:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Ferramentas
        run: python -m pip install aqtinstall ninja
      - name: Compilar e testar
        run: python cpp/tools/build_desktop.py --testes
